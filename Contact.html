<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bihisera - Contact</title>
  <link rel="stylesheet" href="../PageCSS/Contact.css">
  <link rel="icon" type="png" href="logo.png">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Navigation bar -->
  <header>
    <div class="navbar">
      <div class="logo">Bihisera</div>
      <nav class="nav-links">
        <a href="homepage.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="message.html">Message</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Contact content -->
  <div class="contact-content">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you! Reach out using the form below or through our socials.</p>

    <form class="contact-form">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" rows="5" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <p>© 2026 Bihisera. All rights reserved.</p>
      <div class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
      </div>
      <div class="social-icons">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-linkedin-in"></i></a>
      </div>
    </div>
  </footer>
</body>
</html>
