
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message | Bihisera</title>

    <link rel="icon" type="image/png" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="../messagecss.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <div class="navbar">
            <div class="logo">Bihisera</div>

            <nav class="nav-links">
                <a href="home.html">Home</a>
                <a href="About.html">About Us</a>
                <a href="Message.html" aria-current="page">Message</a>
                <a href="Contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main Message Section -->
    <main class="message-container">

        <section class="message-card">

            <div class="message-heading">
                <h1>Let's Talk!</h1>
                <h2>Send Us a Message</h2>

                <p>
                    Have a question, suggestion, or idea?
                    We'd love to hear from you!
                </p>
            </div>

            <form id="messageForm">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="What is your message about?"
                        required>
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Write your message here..."
                        required></textarea>
                </div>

                <button type="submit">Send Message</button>

                <p id="formStatus" role="status" aria-live="polite"></p>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Bihisera. All rights reserved.</p>

            <div class="footer-links">
                <a href="Privacy.html">Privacy Policy</a>
                <a href="Terms.html">Terms of Service</a>
            </div>

            <p class="footer-note">
                Express yourself. Share your ideas. Be Bihisera.
            </p>
        </div>
    </footer>

    <!-- Front-end Form Behavior -->
    <script>
        const messageForm = document.getElementById("messageForm");
        const formStatus = document.getElementById("formStatus");

        messageForm.addEventListener("submit", function(event) {
            event.preventDefault();

            if (!messageForm.checkValidity()) {
                messageForm.reportValidity();
                return;
            }

            formStatus.textContent =
                "Thank you for your message! The form is working, " +
                "but sending messages requires a server connection.";

            formStatus.className = "status-message";

            messageForm.reset();
        });
    </script>

</body>
</html>
